<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esqueci minha senha - Sistema Compras</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="background"></div>
<div class="login-container">
    <div class="card">
        <img src="../assets/Logo.png" alt="Logo Sistema Compras" class="logo">
        <h1>Recuperar senha</h1>
        <p>Digite seu email e enviaremos um link para redefinir sua senha</p>

        <input type="email" id="email" placeholder="Email">

        <button onclick="forgotPassword()" id="btnEnviar">Enviar link</button>

        <p class="card-footer"><a href="login.html">← Voltar para o login</a></p>

        <p id="mensagem"></p>
    </div>
</div>
<script src="../js/utils.js"></script>
<script src="../js/forgot-password.js"></script>
</body>
</html>
