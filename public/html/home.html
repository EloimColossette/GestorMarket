<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard – Eloim</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/home.css">
</head>
<body>

<!-- NAVBAR -->
<script src="../js/layout.js"></script>

<!-- MAIN -->
<main class="main">
    <div class="greeting">
        <h1>Olá, Eloim</h1>
        <p>Bem-vindo ao seu sistema</p>
    </div>

    <div class="grid">

        <!-- Financeira -->
        <div class="card" onclick="openModule('financeira')">
            <div class="card-icon icon-green">
                <svg fill="none" viewBox="0 0 24 24" stroke-width="1.8" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round"
                          d="M12 6v12m-3-2.818l.879.659c1.171.879 3.07.879 4.242 0
                             1.172-.879 1.172-2.303 0-3.182C13.536 12.219 12.768 12 12
                             12c-.725 0-1.45-.22-2.003-.659-1.106-.879-1.106-2.303 0-3.182
                             s2.9-.879 4.006 0l.415.33M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
            </div>
            <h3>Financeira</h3>
            <p>Gerencie receitas, despesas e movimentações financeiras.</p>
            <div class="card-arrow">
                <svg fill="none" viewBox="0 0 24 24" stroke-width="2" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3"/>
                </svg>
            </div>
        </div>

        <!-- Supermercado -->
        <div class="card" onclick="openModule('supermercado')">
            <div class="card-icon icon-blue">
                <svg fill="none" viewBox="0 0 24 24" stroke-width="1.8" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round"
                          d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5
                             14.25a3 3 0 00-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684
                             2.924-7.138a60.114 60.114 0 00-16.536-1.84M7.5 14.25L5.106
                             5.272M6 20.25a.75.75 0 11-1.5 0 .75.75 0 011.5 0zm12.75 0a.75.75
                             0 11-1.5 0 .75.75 0 011.5 0z"/>
                </svg>
            </div>
            <h3>Gestão de Supermercado</h3>
            <p>Controle produtos, estoque, fornecedores e muito mais.</p>
            <div class="card-arrow">
                <svg fill="none" viewBox="0 0 24 24" stroke-width="2" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3"/>
                </svg>
            </div>
        </div>

        <!-- Lista de Compras -->
        <div class="card" onclick="openModule('compras')">
            <div class="card-icon icon-purple">
                <svg fill="none" viewBox="0 0 24 24" stroke-width="1.8" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round"
                          d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2
                             2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0
                             012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/>
                </svg>
            </div>
            <h3>Lista de Compras</h3>
            <p>Crie e gerencie sua lista de compras de forma fácil.</p>
            <div class="card-arrow">
                <svg fill="none" viewBox="0 0 24 24" stroke-width="2" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3"/>
                </svg>
            </div>
        </div>

    </div>
</main>

<script src="../js/home.js"></script>
</body>
</html>
