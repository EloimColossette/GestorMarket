<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Compra</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/supermarket.css">
    <link rel="stylesheet" href="../css/new-purchase.css">
</head>
<body>

<div class="page">
    <button id="backBtn" class="secondary-btn back-btn-outside" onclick="goBack()">← Voltar</button>

    <div class="window">

        <div class="window-header">
            <h1>Nova Compra</h1>
            <p>Registre uma nova compra</p>
        </div>

        <div class="form-container">

            <!-- ENTRADA: SUPERMERCADO (lista suspensa) -->
            <select id="supermarketSelect">
                <option value="">Carregando supermercados...</option>
            </select>

            <!-- ENTRADA: DATA DA COMPRA -->
            <input id="purchaseDate" type="date" />

        </div>

        <div class="item-form">

            <h3 class="section-title">Adicionar item</h3>

            <div class="form-container">

                <!-- ENTRADA: NOME DO PRODUTO -->
                <input id="productName" type="text" placeholder="Nome do produto" />

                <div class="item-row">
                    <!-- ENTRADA: QUANTIDADE -->
                    <input id="quantity" type="number" min="1" step="1" placeholder="Quantidade" />

                    <!-- ENTRADA: PREÇO UNITÁRIO -->
                    <input id="unitPrice" type="number" min="0" step="0.01" placeholder="Preço unitário (R$)" />
                </div>

                <!-- ENTRADA: PROMOÇÃO ATIVA -->
                <label class="checkbox-label">
                    <input id="promotionActive" type="checkbox" onchange="togglePromotionFields()" />
                    Item em promoção?
                </label>

                <div id="promotionFields" class="promotion-fields hidden">

                    <!-- ENTRADA: TIPO DE PROMOÇÃO -->
                    <select id="promotionType" onchange="togglePromotionTypeFields()">
                        <option value="">Selecione o tipo de promoção...</option>
                        <option value="leve_pague">Leve X, Pague Y</option>
                        <option value="percentual">Desconto percentual (%)</option>
                        <option value="valor_fixo">Desconto em valor fixo (R$)</option>
                    </select>

                    <!-- CAMPOS DO TIPO "LEVE X, PAGUE Y" -->
                    <div id="levePagueFields" class="item-row hidden">
                        <input id="promotionBuyQuantity" type="number" min="1" step="1" placeholder="Leve (quantidade)" />
                        <input id="promotionPayQuantity" type="number" min="1" step="1" placeholder="Pague (quantidade)" />
                    </div>

                    <!-- CAMPO DO TIPO "PERCENTUAL" -->
                    <input id="promotionPercent" type="number" min="1" max="100" step="0.01"
                           class="hidden" placeholder="Percentual de desconto (%)" />

                    <!-- CAMPO DO TIPO "VALOR FIXO" -->
                    <input id="promotionDiscountValue" type="number" min="0.01" step="0.01"
                           class="hidden" placeholder="Valor do desconto (R$)" />

                    <!-- ENTRADA: DESCRIÇÃO DA PROMOÇÃO (opcional) -->
                    <input id="promotionDescription" type="text" placeholder="Observações da promoção (opcional)" />

                </div>

                <button class="secondary-btn" onclick="addItem()">+ Adicionar Item</button>

            </div>

            <!-- BOTÃO PARA MOSTRAR/ESCONDER OS ITENS JÁ ADICIONADOS -->
            <button id="toggleItemsBtn" class="secondary-btn toggle-items-btn" onclick="toggleItemsList()">
                <span id="toggleItemsLabel">Nenhum item adicionado</span>
                <span id="toggleItemsArrow" class="toggle-arrow">▼</span>
            </button>

            <!-- LISTA DE ITENS JÁ ADICIONADOS (recolhível) -->
            <div id="itemsList" class="items-list hidden"></div>

            <div id="totalDisplay" class="total-display">Total: R$ 0,00</div>

        </div>

        <div class="form-container">
            <button class="primary-btn" onclick="savePurchase()">Salvar Compra</button>
        </div>

        <div class="window-footer">
            <small>Sistema de Controle de Compras</small>
        </div>

    </div>
</div>

<!-- MODAL: LISTA COMPLETA DE ITENS (usado quando há mais de 5 itens) -->
<div id="itemsModalOverlay" class="modal-overlay hidden" onclick="closeItemsModalOnOverlay(event)">
    <div class="modal-box">

        <div class="modal-header">
            <h3>Itens da compra</h3>
            <button class="modal-close-btn" onclick="closeItemsModal()">✕</button>
        </div>

        <div id="itemsListModal" class="items-list modal-items-list"></div>

        <div id="totalDisplayModal" class="total-display">Total: R$ 0,00</div>

    </div>
</div>
<script src="../js/config.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/new-purchase.js"></script>
</body>
</html>
