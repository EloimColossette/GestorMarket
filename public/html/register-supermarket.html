<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supermercados</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/supermarket.css">
</head>
<body>

<!-- NAVBAR -->
<script src="../js/layout.js"></script>

<div class="page">
    <div class="window">

        <!-- TELA CADASTRO -->
        <div id="registerScreen">
            <div class="window-header">
                <h1>Supermercados</h1>
                <p>Cadastro de supermercados</p>
            </div>

            <div class="form-container">
                <input id="name" type="text" placeholder="Nome do supermercado" />
                <button class="primary-btn" onclick="saveSupermarket()">Salvar Supermercado</button>
                <button class="secondary-btn" onclick="showListScreen()">📋 Ver Lista</button>
                <button class="secondary-btn" onclick="goBack()">← Voltar</button>
            </div>
        </div>

        <!-- TELA LISTA -->
        <div id="listScreen" style="display: none;">
            <div class="window-header">
                <h1>Lista de Supermercados</h1>
                <p>Pesquisa e gerenciamento</p>
            </div>

            <button class="secondary-btn" onclick="showRegisterScreen()">← Voltar</button>

            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Pesquisar supermercado..." onkeyup="filterSupermarkets()" />
            </div>

            <div id="supermarketList" class="list-container"></div>
        </div>

    </div>
</div>

<script src="../js/register-supermarket.js"></script>
</body>
</html>
