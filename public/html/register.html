<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Sistema Compras</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="background"></div>
<div class="login-container">
    <div class="card">
        <img src="../assets/logo.png" alt="Logo Sistema Compras" class="logo">
        <h1>Criar conta</h1>
        <p>Preencha os dados para se cadastrar</p>

        <div class="input-row">
            <input type="text" id="firstName" placeholder="Nome">
            <input type="text" id="lastName" placeholder="Sobrenome">
        </div>

        <input type="text" id="cpf" placeholder="CPF">
        <input type="text" id="phoneNumber" placeholder="Telefone">
        <input type="email" id="email" placeholder="Email">

        <div class="password-container">
            <input type="password" id="password" placeholder="Senha">
            <span id="toggleRegisterPassword" class="toggle-password"
                  onclick="togglePassword('password', 'toggleRegisterPassword')">👁️</span>
        </div>

        <div class="password-container">
            <input type="password" id="confirmPassword" placeholder="Confirmar senha">
            <span id="toggleConfirmPassword" class="toggle-password"
                  onclick="togglePassword('confirmPassword', 'toggleConfirmPassword')">👁️</span>
        </div>

        <button onclick="register()" id="btnRegister">Cadastrar</button>

        <p class="card-footer">Já tem conta? <a href="login.html">Entrar</a></p>

        <p id="mensagem"></p>
    </div>
</div>
<script src="../js/config.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/register.js"></script>
<script>
    applyCpfMask("cpf");
    applyPhoneMask("phoneNumber");
</script>
</body>
</html>
