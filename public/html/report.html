<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatório de Compras</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/supermarket.css">
    <link rel="stylesheet" href="../css/new-purchase.css">
</head>
<body>

<!-- NAVBAR -->

<button id="backBtn" class="secondary-btn back-btn-outside" onclick="goBack()">← Voltar</button>

<div class="page">
    <div class="window">

        <!-- TELA RESUMO -->
        <div id="summaryScreen">

            <div class="window-header">
                <h1>Relatório de Compras</h1>
                <p>Filtre por supermercado e/ou data</p>
            </div>

            <div class="form-container">
                <select id="filterSupermarket">
                    <option value="">Todos os supermercados</option>
                </select>

                <input type="date" id="filterDate" />

                <button class="primary-btn" onclick="loadSummary()">🔍 Filtrar</button>
                <button class="secondary-btn" onclick="clearFilters()">Limpar filtros</button>
            </div>

            <div id="summaryList" class="list-container"></div>

            <div class="window-footer">
                <small>Sistema de Controle de Compras</small>
            </div>
        </div>

        <!-- TELA DETALHE -->
        <div id="detailScreen" style="display: none;">

            <div class="window-header">
                <h1 id="detailTitle">Detalhe</h1>
                <p>Produtos e promoções</p>
            </div>

            <div id="detailList" class="list-container"></div>

            <div id="detailTotal" class="total-display"></div>

        </div>

    </div>
</div>
<script src="../js/config.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/report.js"></script>
</body>
</html>
