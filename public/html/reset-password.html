<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir Senha - Sistema Compras</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="background"></div>
<div class="login-container">
    <div class="card">
        <img src="../assets/logo.png" alt="Logo Sistema Compras" class="logo">
        <h1>Nova senha</h1>
        <p>Insira o token recebido por email e defina sua nova senha</p>

        <input type="text" id="token" placeholder="Token do email">

        <div class="password-container">
            <input type="password" id="newPassword" placeholder="Nova senha">
            <span id="toggleNew" class="toggle-password"
                  onclick="togglePassword('newPassword', 'toggleNew')">👁️</span>
        </div>

        <div class="password-container">
            <input type="password" id="confirmPassword" placeholder="Confirmar nova senha">
            <span id="toggleConfirm" class="toggle-password"
                  onclick="togglePassword('confirmPassword', 'toggleConfirm')">👁️</span>
        </div>

        <button onclick="resetPassword()" id="btnReset">Redefinir senha</button>

        <p class="card-footer"><a href="login.html">← Voltar para o login</a></p>

        <p id="mensagem"></p>
    </div>
</div>
<script src="../js/config.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/reset-password.js"></script>
</body>
</html>
